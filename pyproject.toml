[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibm_cloud_fail_over"
version = "1.0.25"
authors = [
  { name="Eran Gampel", email="dev@gampel.net" },
]
description = "Package providing IBM Cloud failover functions for HA clusters."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19",
    "pylint==3.3.9",
]

[project.urls]
Homepage = "https://github.com/IBM/ibm_cloud_fail_over"
Issues = "https://github.com/IBM/ibm_cloud_fail_over/issues"

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true

[tool.pylint.messages_control]
disable = [
    "C0103", # invalid-names
    "C0301", # line-too-long
    "C0302", # too-many-lines
    "R0902", # too-many-instance-attributes
    "R0913", # too-many-arguments
    "R0915", # too-many-statements
    "R0917", # too-many-positional-arguments
    "R1702", # too-many-nested blocks
]
